<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cv Pribadi Saya</title>
    <link rel="stylesheet" href="style3.css">
</head>
<body>
    <div class="cv-container">
        <!-- Header Profil -->
        <header class="cv-header">
            <h1>Ricardo octavio</h1>
            <p>mahasiswa smk strada jakarta</p>
        </header>

        <div class="toggle-container">
            <button class="btn-toggle" id="themeToggleBtn"> 
                Switch to Dark Mode
            </button>
        </div>

        <!-- Kartu Informasi Diri (Card Info) -->
        <section class="cv-card">
            <h2>Tentang Saya</h2>
            <p>Saya adalah siswa dari smk strada jakarta dengan jurusan TIP</p>
        </section>

        <!-- Kartu Riwayat Pendidikan -->
        <section class="cv-card">
            <h2>Riwayat Pendidikan</h2>
            <p><strong>SMK STRADA JAKARTA </strong> TEKNIK INFORMATIKA PEMROGAMAN</p>
        </section>

        <!-- Bagian Keahlian dengan Flexbox -->
        <section class="cv-card">
            <h2>Keahlian Utama</h2>
            <div class="skills-container">
                <div class="skill-item">HTML5</div>
                <div class="skill-item">CSS3 Layouting</div>
                <div class="skill-item">Responsive Design</div>
                <div class="skill-item">Git & GitHub</div>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
